version: 2
updates:
  - package-ecosystem: npm
    directory: '/mrtt-ui'
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    # The app is pinned to Node 22 (.nvmrc, engines), so @types/node majors are a
    # deliberate decision, not a routine update.
    ignore:
      - dependency-name: '@types/node'
        update-types: ['version-update:semver-major']
    groups:
      radix:
        patterns:
          - '@radix-ui/*'
      tanstack:
        patterns:
          - '@tanstack/*'
      testing:
        patterns:
          - 'vitest'
          # The coverage provider must move with vitest, or `vitest run --coverage` breaks.
          - '@vitest/*'
          - '@testing-library/*'
          - 'jsdom'
      types:
        patterns:
          - '@types/*'

  - package-ecosystem: github-actions
    directory: '/'
    schedule:
      interval: weekly
