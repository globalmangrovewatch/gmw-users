name: CI

on:
  pull_request:
    paths:
      - 'mrtt-ui/**'
      - '.github/workflows/ci.yml'
  push:
    branches: [develop, main]
    paths:
      - 'mrtt-ui/**'
      - '.github/workflows/ci.yml'

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

defaults:
  run:
    working-directory: mrtt-ui

jobs:
  checks:
    name: Lint, format, typecheck, test, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          package_json_file: mrtt-ui/package.json

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: mrtt-ui/.nvmrc
          cache: pnpm
          cache-dependency-path: mrtt-ui/pnpm-lock.yaml

      # --ignore-scripts: dependency lifecycle scripts are a supply-chain vector, and the
      # `prepare` git-hook install is pointless in CI.
      - run: pnpm install --frozen-lockfile --ignore-scripts

      - run: pnpm lint

      - run: pnpm format:check

      # Typecheck runs here only (not in the pre-commit hook) during the JS→TS transition.
      - run: pnpm check-types

      - run: pnpm test:unit:coverage

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage
          path: mrtt-ui/coverage
          retention-days: 7

      # No deployment variables in CI: the build only has to compile.
      - run: pnpm build
        env:
          SKIP_ENV_VALIDATION: 'true'
          NEXT_TELEMETRY_DISABLED: '1'
